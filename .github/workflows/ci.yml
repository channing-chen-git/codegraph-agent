name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall codegraph_agent
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Offline eval
        run: python -m codegraph_agent.eval_runner --repo examples/mini_repo --tasks eval/tasks.json
